name: Checks and packages

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/ISSUE_TEMPLATE/**', 'LICENSE', 'licenses/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '.github/ISSUE_TEMPLATE/**', 'LICENSE', 'licenses/**']
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build_number:
        type: number
        required: true
      source_sha:
        type: string
        required: true
      platform:
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      desktop_matrix: ${{ steps.targets.outputs.desktop_matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Set alpha version
        if: inputs.version != ''
        run: node scripts/release/version.mjs "$RELEASE_VERSION" "$BUILD_NUMBER"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
      - run: npm ci
      - run: node --test scripts/release/*.test.mjs
      - run: node --test apps/native/scripts/*.test.mjs
      - run: npm run test --workspace @norr/web
      - run: npm run build
      - name: Select desktop targets
        id: targets
        env:
          RELEASE_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const platform = process.env.RELEASE_PLATFORM;
          if (!['all', 'windows'].includes(platform)) throw new Error('Invalid release platform');
          const targets = [
            { platform: 'macos', arch: 'arm64', runner: 'macos-15', build: 'mac', artifact: 'Norr-macos-arm64', path: 'target/packages/*-macos-arm64.zip' },
            { platform: 'macos', arch: 'x86_64', runner: 'macos-15-intel', build: 'mac', artifact: 'Norr-macos-x64', path: 'target/packages/*-macos-x64.zip' },
            { platform: 'windows', arch: 'x86_64', runner: 'windows-2025', build: 'windows', artifact: 'Norr-windows-x64', path: 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' },
          ];
          const include = targets.filter(target => platform === 'all' || target.platform === platform);
          appendFileSync(process.env.GITHUB_OUTPUT, `desktop_matrix=${JSON.stringify({ include })}\n`);
          NODE

  desktop:
    name: ${{ matrix.platform }} ${{ matrix.arch }} checks and package
    needs: web
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.web.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Set alpha version
        if: inputs.version != ''
        run: node scripts/release/version.mjs "$RELEASE_VERSION" "$BUILD_NUMBER"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Share Windows target between checks and packaging
        if: matrix.platform == 'windows'
        run: echo 'CARGO_BUILD_TARGET=x86_64-pc-windows-msvc' >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --release --locked
      - run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - name: Build login-enabled package
        if: inputs.version != '' && github.ref == 'refs/heads/main'
        run: npm run build:${{ matrix.build }} -- --ci
        env:
          NORR_POLESTAR_CN_SIGNING_KEY: ${{ secrets.NORR_POLESTAR_CN_SIGNING_KEY }}
      - name: Archive macOS app
        if: matrix.platform == 'macos' && inputs.version != '' && github.ref == 'refs/heads/main'
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test "$(lipo -archs target/release/bundle/macos/Norr.app/Contents/MacOS/norr)" = "$EXPECTED_ARCH"
          codesign --verify --strict target/release/bundle/macos/Norr.app
          mkdir -p target/packages
          ditto -c -k --keepParent target/release/bundle/macos/Norr.app "target/packages/$ARTIFACT_NAME.zip"
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.version != '' && github.ref == 'refs/heads/main'
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ARM64 package
    needs: web
    if: inputs.version != '' && github.ref == 'refs/heads/main' && inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Set alpha version
        run: node scripts/release/version.mjs "$RELEASE_VERSION" "$BUILD_NUMBER"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NORR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing NORR_ANDROID_KEYSTORE_BASE64'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/norr.keystore"
      - name: Build Android package
        run: npm run build:android -- --ci
        env:
          NORR_POLESTAR_CN_SIGNING_KEY: ${{ secrets.NORR_POLESTAR_CN_SIGNING_KEY }}
          NORR_ANDROID_KEYSTORE: ${{ runner.temp }}/norr.keystore
          NORR_ANDROID_STORE_PASSWORD: ${{ secrets.NORR_ANDROID_STORE_PASSWORD }}
          NORR_ANDROID_KEY_ALIAS: ${{ secrets.NORR_ANDROID_KEY_ALIAS }}
          NORR_ANDROID_KEY_PASSWORD: ${{ secrets.NORR_ANDROID_KEY_PASSWORD }}
      - name: Verify Android package
        run: |
          apk=apps/native/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          mkdir -p target/packages
          cp "$apk" target/packages/Norr-android-arm64.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Norr-android-arm64
          path: target/packages/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/norr.keystore"

  ios:
    name: iOS ARM64 ${{ matrix.variant }} package
    needs: web
    if: inputs.version != '' && github.ref == 'refs/heads/main' && inputs.platform != 'windows'
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: simulator
            target: aarch64-apple-ios-sim
            sdk: iphonesimulator
            build: ios
            artifact: Norr-ios-arm64-simulator
            path: target/ios/*-simulator.zip
          - variant: unsigned
            target: aarch64-apple-ios
            sdk: iphoneos
            build: ios:unsigned
            artifact: Norr-ios-arm64-unsigned
            path: target/ios/*-unsigned.ipa
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Set alpha version
        run: node scripts/release/version.mjs "$RELEASE_VERSION" "$BUILD_NUMBER"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Check iOS toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk "${{ matrix.sdk }}" --show-sdk-version
      - name: Build iOS package
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { parseEnv } from 'node:util';
          const key = process.env.NORR_POLESTAR_CN_SIGNING_KEY;
          const configuration = `NORR_POLESTAR_CN_SIGNING_KEY=${JSON.stringify(key)}\n`;
          if (!key || parseEnv(configuration).NORR_POLESTAR_CN_SIGNING_KEY !== key) {
            throw new Error('Invalid iOS build configuration');
          }
          writeFileSync('.env.secrets', configuration, { mode: 0o600 });
          NODE
          npm run build:${{ matrix.build }} -- --ci
        env:
          NORR_POLESTAR_CN_SIGNING_KEY: ${{ secrets.NORR_POLESTAR_CN_SIGNING_KEY }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Remove iOS build configuration
        if: always()
        run: rm -f .env.secrets
