[package]
name = "norr"
version.workspace = true
edition.workspace = true

[lib]
name = "norr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["polestar4"]
polestar4 = ["norr-vehicle-core/polestar4"]
p4-demo = []
p4-field-test = ["norr-vehicle-core/p4-field-test"]
polestar4-test = ["polestar4", "norr-vehicle-core/polestar4-test"]

[dev-dependencies]
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
tauri-utils = { version = "2", features = ["build"] }

[dependencies]
async-trait = "0.1"
sha2 = "0.10"
norr-vehicle-core = { path = "../../../crates/vehicle-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(any(target_os = "macos", target_os = "android", target_os = "windows"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
semver = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.42.0", features = ["bundled"] }

[target.'cfg(target_os = "ios")'.dependencies]
rusqlite = "0.42.0"
dirs = "7"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
sha2 = "0.10"
rfd = "0.15"
winreg = "0.55"
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_System_Com"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
